<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="bgClip">
      <rect x="0" y="0" width="1000" height="1000" rx="140"/>
    </clipPath>
  </defs>

  <!-- Background: dark grayish-black -->
  <g clip-path="url(#bgClip)">
    <rect x="0" y="0" width="1000" height="1000" fill="#1C1E1F"/>
  </g>

  <!-- Abstract mark: three rounded bars forming a checklist/flow motif -->
  <g>
    <!-- Bar 1 - primary, longest -->
    <rect x="190" y="270" width="560" height="120" rx="60" fill="#334B52"/>

    <!-- Bar 2 - secondary, medium, offset -->
    <rect x="190" y="440" width="430" height="120" rx="60" fill="#6FA5A0"/>

    <!-- Bar 3 - accent, short, forms checkmark tail -->
    <rect x="190" y="610" width="270" height="120" rx="60" fill="#E58B73"/>

    <!-- Accent circle acting as a "check node" / bullet, unifying abstract shape -->
    <circle cx="700" cy="640" r="105" fill="#E58B73"/>
    <path d="M645 645 L685 690 L760 590" stroke="#1C1E1F" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
